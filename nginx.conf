server {
    listen 80;
    server_name ninewaiyan.online www.ninewaiyan.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://www.ninewaiyan.online$request_uri;
    }
}


server {
    listen 443 ssl;
    server_name ninewaiyan.online;

    ssl_certificate /etc/letsencrypt/live/ninewaiyan.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ninewaiyan.online/privkey.pem;

    return 301 https://www.ninewaiyan.online$request_uri;
}

server {
    listen 443 ssl;
    server_name www.ninewaiyan.online;

    ssl_certificate /etc/letsencrypt/live/ninewaiyan.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ninewaiyan.online/privkey.pem;

    root /usr/share/nginx/html;

    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # The homepage is the only application route. Do not return soft 404s.
    error_page 404 /404.html;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        return 301 https://www.ninewaiyan.online/$is_args$args;
    }

    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /sitemap.xml {
        default_type application/xml;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-store" always;
    }

    # Vite names these assets with a content hash.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri =404;
    }

}
